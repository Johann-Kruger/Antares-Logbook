# Checks every pull request (and main) against the app's browser tests.
# Nothing here builds or signs an APK, and no secrets are used.
name: App tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: www/index.html is up to date with src/
        run: |
          cp www/index.html "$RUNNER_TEMP/committed.html"
          python3 tools/build.py
          cmp www/index.html "$RUNNER_TEMP/committed.html"
      - name: Syntax check the app script
        run: |
          awk '/<script>/{n++; if(n==3){f=1; next}} /<\/script>/{f=0} f' www/index.html > "$RUNNER_TEMP/app.js"
          node --check "$RUNNER_TEMP/app.js"
      - name: Install test tools
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Browser tests
        run: tests/run.sh
