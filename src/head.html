<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Antares Logbook</title>
<script>
// ---------------- Global error overlay ----------------
// First on the page so it catches a failure anywhere, including the libraries
// below. If the app ever goes blank, a photo of this screen shows the cause.
(function(){
  function showFatalErrorOverlay(message, detail){
    try{
      if(document.getElementById("fatalErrorOverlay")) return;
      var el = document.createElement("div");
      el.id = "fatalErrorOverlay";
      el.style.cssText = "position:fixed; inset:0; background:#0A2530; color:#EAF4F1; z-index:999999; padding:20px; overflow:auto; font-family:monospace; font-size:14px; white-space:pre-wrap;";
      el.textContent = "Something went wrong loading the app.\n\nPlease photograph or screenshot this screen and send it to Johann.\n\n" + message + (detail ? ("\n\n" + detail) : "");
      (document.body || document.documentElement).appendChild(el);
    }catch(err){}
  }
  window.addEventListener("error", function(e){
    showFatalErrorOverlay((e && e.message) || "Unknown error",
      (e && e.error && e.error.stack) || (e && e.filename ? (e.filename + ":" + e.lineno + ":" + e.colno) : ""));
  });
  window.addEventListener("unhandledrejection", function(e){
    var reason = e && e.reason;
    showFatalErrorOverlay((reason && reason.message) || String(reason), (reason && reason.stack) || "");
  });
})();
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐟</text></svg>">
<style>
  :root{
    --ink:#0A2530; --surface:#0F3140; --surface-2:#154556; --surface-3:#1C5468;
    --accent:#E7772F; --accent-ink:#1A0F04; --kelp:#3F9668; --kelp-ink:#082013;
    --text:#EAF4F1; --text-dim:#9FBCC1; --line:rgba(234,244,241,0.14);
    --danger:#D3564B; --yellow:#E8C547; --yellow-ink:#2E2200; --blue:#2E6FD9; --blue-ink:#FFFFFF;
  }
  :root[data-theme="sun"]{
    --ink:#F4F7F6; --surface:#FFFFFF; --surface-2:#E6EDEB; --surface-3:#D3DEDA;
    --text:#06141A; --text-dim:#27424A; --line:rgba(6,20,26,0.28);
    --accent:#D9661F; --accent-ink:#140A02; --kelp:#256B45; --kelp-ink:#FFFFFF;
    --danger:#B3261E; --yellow:#F2C230; --yellow-ink:#2E2200; --blue:#1E54B7; --blue-ink:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--ink); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-tap-highlight-color:transparent;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    overscroll-behavior-y:contain;
  }
  button{ font-family:inherit; }
  .app{ max-width:640px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; }
  .hidden{ display:none !important; }

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20; background:var(--ink);
    display:flex; align-items:center; gap:10px; padding:12px 12px 10px 16px;
    border-bottom:1px solid var(--line);
  }
  .topbar .mark{ width:38px; height:38px; border-radius:10px; background:var(--surface-3); display:flex; align-items:center; justify-content:center; font-size:20px; flex:none; }
  .topbar .id{ flex:1; min-width:0; }
  .topbar .vessel{ font-weight:800; font-size:16px; letter-spacing:.4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .topbar .sub{ font-size:13px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .iconbtn{ background:none; border:none; color:var(--text); font-size:22px; width:48px; height:48px; border-radius:12px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none; }
  .iconbtn:active{ background:var(--surface-2); }

  .screen{ flex:1; padding:14px 16px 130px; }
  .topbar{ padding-left:6px; }

  /* ---------- Side menu ---------- */
  .drawer-wrap{ position:fixed; inset:0; z-index:60; background:rgba(0,0,0,0); pointer-events:none; transition:background .2s; }
  .drawer-wrap.open{ background:rgba(0,0,0,.55); pointer-events:auto; }
  .drawer{ position:absolute; top:0; bottom:0; left:0; width:min(84vw, 330px); background:var(--surface); border-right:1px solid var(--line);
    transform:translateX(-102%); transition:transform .2s ease; overflow-y:auto; padding:calc(14px + env(safe-area-inset-top,0px)) 10px calc(20px + env(safe-area-inset-bottom,0px)); }
  .drawer-wrap.open .drawer{ transform:none; }
  .drawer .dhead{ padding:6px 10px 14px; border-bottom:1px solid var(--line); margin-bottom:6px; }
  .drawer .dhead .v{ font-weight:800; font-size:18px; letter-spacing:.4px; }
  .drawer .dhead .t{ font-size:13px; color:var(--text-dim); margin-top:2px; }
  .drawer .dsec{ font-size:12px; font-weight:800; letter-spacing:.8px; color:var(--text-dim); text-transform:uppercase; padding:14px 10px 6px; }
  .drawer .ditem{ display:flex; align-items:center; gap:14px; width:100%; min-height:52px; padding:10px; border:none; background:none; color:var(--text);
    font-size:16px; font-weight:600; border-radius:12px; cursor:pointer; text-align:left; }
  .drawer .ditem:active, .drawer .ditem.on{ background:var(--surface-2); }
  .drawer .ditem.on{ color:var(--accent); }
  .drawer .ditem .ic{ width:26px; text-align:center; font-size:19px; flex:none; }
  .drawer .ditem .lb{ flex:1; }
  .drawer .ditem .bd{ font-size:13px; font-weight:800; color:var(--text-dim); background:var(--surface-3); border-radius:10px; padding:2px 8px; }
  .drawer .ditem .bd.warn{ background:var(--yellow); color:var(--yellow-ink); }
  .drawer .ditem.danger{ color:var(--danger); }
  #btnBack{ background:none; padding:6px 2px; min-height:44px; color:var(--text-dim); font-weight:700; margin-bottom:6px !important; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .card h2{ margin:0 0 10px; font-size:14px; font-weight:700; color:var(--text-dim); letter-spacing:.3px; }
  .row-between{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .helptext{ font-size:13px; color:var(--text-dim); line-height:1.5; margin:6px 0 0; }
  .sectionlabel{ font-size:13px; color:var(--text-dim); margin:14px 0 6px; font-weight:600; }

  .field{ margin-bottom:10px; }
  .field label{ display:block; font-size:13px; color:var(--text-dim); margin-bottom:4px; }
  .field input, .field select, .field textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:10px 12px; font-size:16px; font-family:inherit; min-height:48px;
  }
  .field textarea{ min-height:70px; }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:12px; padding:13px 18px; font-size:16px; font-weight:700; cursor:pointer; width:100%; min-height:52px; }
  .btn-accent{ background:var(--accent); color:var(--accent-ink); }
  .btn-ghost{ background:var(--surface-2); color:var(--text); }
  .btn-outline{ background:transparent; color:var(--text); border:1px solid var(--line); }
  .btn-danger{ background:transparent; color:var(--danger); border:1px solid var(--danger); }
  .btn-success{ background:var(--kelp); color:var(--kelp-ink); }
  .btn-sm{ width:auto; min-height:48px; padding:11px 14px; font-size:14px; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-big{ min-height:72px; font-size:22px; letter-spacing:.5px; }
  .btnrow{ display:flex; gap:10px; }
  .btnrow .btn{ flex:1; }
  .actions{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }

  .chiprow{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{ min-height:48px; display:inline-flex; align-items:center; justify-content:center; padding:10px 14px; border-radius:12px; background:var(--surface-2); border:1px solid var(--line); font-size:15px; font-weight:700; color:var(--text-dim); cursor:pointer; user-select:none; }
  .chip.on{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .chip.sq{ width:52px; padding:0; }

  .lineitem{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px; display:flex; align-items:center; gap:12px; cursor:pointer; }
  .lineitem .num{ min-width:48px; height:48px; padding:0 6px; border-radius:11px; background:var(--surface-3); display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:800; flex:none; }
  .lineitem .meta{ flex:1; min-width:0; }
  .lineitem .t1{ font-weight:700; font-size:16px; }
  .lineitem .t2{ font-size:13px; color:var(--text-dim); margin-top:3px; }
  .lineitem .chev{ color:var(--text-dim); font-size:22px; }
  .tag{ display:inline-block; padding:2px 8px; border-radius:6px; background:var(--surface-3); font-size:12px; font-weight:800; letter-spacing:.3px; }
  .tag.open{ background:var(--kelp); color:var(--kelp-ink); }
  .tag.yf{ background:var(--yellow); color:var(--yellow-ink); }
  .empty{ text-align:center; color:var(--text-dim); padding:50px 20px; font-size:15px; line-height:1.6; }
  .empty .big{ font-size:44px; margin-bottom:8px; }

  .totals{ display:flex; justify-content:space-around; text-align:center; gap:8px; }
  .totals .n{ font-size:34px; font-weight:800; color:var(--kelp); line-height:1.1; }
  .totals .n.yf{ color:var(--yellow); }
  .totals .l{ font-size:13px; color:var(--text-dim); }

  .dayhead{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin:18px 0 8px; }
  .dayhead .d{ font-weight:800; font-size:16px; }
  .dayhead .s{ font-size:13px; color:var(--text-dim); }
  .stoprow{ display:grid; grid-template-columns:58px 1fr auto; gap:10px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; cursor:pointer; }
  .stoprow .tm{ font-weight:800; font-size:16px; }
  .stoprow .pos{ font-size:13px; color:var(--text-dim); }
  .stoprow .cond{ font-size:12px; color:var(--text-dim); margin-top:2px; }
  .stoprow .fish{ text-align:right; }
  .stoprow .fish .a{ font-size:22px; font-weight:800; color:var(--kelp); }
  .stoprow .fish .r{ font-size:12px; color:var(--text-dim); }

  .fab-wrap{ position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:640px; z-index:30; padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px)); background:linear-gradient(0deg, var(--ink) 70%, transparent); }

  .counter{ display:flex; align-items:center; gap:10px; }
  .counter button{ width:60px; height:60px; border-radius:12px; background:var(--surface-2); border:1px solid var(--line); color:var(--text); font-size:22px; font-weight:800; cursor:pointer; flex:none; }
  .counter button:active{ background:var(--surface-3); }
  .counter input{ flex:1; min-width:0; text-align:center; font-size:40px; font-weight:800; background:var(--surface-2); border:1px solid var(--line); border-radius:12px; color:var(--text); height:72px; }
  .counter.small input{ font-size:28px; height:60px; }
  .quick{ display:flex; gap:8px; margin-top:8px; }
  .quick button{ flex:1; min-height:48px; border-radius:10px; background:var(--surface-2); border:1px solid var(--line); color:var(--text); font-size:16px; font-weight:700; cursor:pointer; }
  .gpsbox{ background:var(--surface-2); border-radius:12px; padding:10px 12px; display:flex; align-items:center; gap:10px; }
  .gpsbox .p{ flex:1; font-size:17px; font-weight:700; }
  .gpsbox .p small{ display:block; font-size:12px; font-weight:600; color:var(--text-dim); }
  .gpsbox.wait .p{ color:var(--yellow); }
  .gpsbox.bad .p{ color:var(--danger); }

  /* Weigh sheet: 10 weights per row, like the paper sheet, with the fish numbers at the start of each row. */
  .wsrow{ display:grid; grid-template-columns:30px repeat(10, 1fr); gap:3px; margin-bottom:3px; align-items:stretch; }
  .wsrow .rn{ font-size:10px; color:var(--text-dim); display:flex; align-items:center; justify-content:flex-end; padding-right:3px; line-height:1.1; text-align:right; }
  .wsrow .rsum{ grid-column:2 / -1; font-size:11px; color:var(--text-dim); text-align:right; margin-top:-1px; }
  .wscell{ background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:9px 0; min-height:40px; text-align:center; cursor:pointer; display:flex; flex-direction:column; justify-content:center; min-width:0; }
  .wscell.empty{ background:transparent; border-style:dashed; cursor:default; }
  .wscell .v{ font-size:13px; font-weight:800; letter-spacing:-.3px; }
  .wscell .i{ font-size:9px; color:var(--text-dim); }
  .wscell.yf{ border-color:var(--yellow); }
  .wsentry{ display:flex; gap:10px; }
  .wsentry input{ flex:1; min-width:0; font-size:34px; font-weight:800; text-align:center; height:72px; background:var(--surface-2); border:1px solid var(--line); border-radius:12px; color:var(--text); }
  .wsentry .btn{ width:110px; min-height:72px; font-size:20px; }

  .tbl{ width:100%; border-collapse:collapse; font-size:14px; }
  .tbl td, .tbl th{ padding:7px 4px; border-bottom:1px solid var(--line); text-align:left; }
  .tbl th{ color:var(--text-dim); font-weight:600; font-size:12px; }
  .tbl td.r, .tbl th.r{ text-align:right; }

  .sheet-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:40; display:flex; align-items:flex-end; }
  .sheet{ background:var(--surface); width:100%; max-width:640px; margin:0 auto; border-radius:18px 18px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px)); max-height:92vh; overflow:auto; }
  .sheet h2{ margin:0 0 12px; font-size:20px; }
  .sheet-text{ font-size:16px; line-height:1.5; margin:0 0 14px; white-space:pre-line; }
  .sheet-actions{ display:flex; flex-direction:column; gap:10px; }
  .sheet-foot{ position:sticky; bottom:calc(-18px - env(safe-area-inset-bottom,0px)); background:var(--surface); padding:12px 0 4px; margin-top:12px; border-top:1px solid var(--line); display:flex; gap:10px; }
  .sheet-foot .btn{ flex:1; }
  details.more{ margin-top:10px; border-top:1px solid var(--line); padding-top:6px; }
  details.more summary{ font-size:15px; font-weight:700; padding:12px 0; cursor:pointer; color:var(--text); }

  .toast{ position:fixed; left:50%; bottom:calc(100px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--surface-3); color:var(--text); padding:12px 18px; border-radius:20px; font-size:15px; z-index:100; opacity:0; pointer-events:none; transition:opacity .2s; font-weight:700; box-shadow:0 6px 20px rgba(0,0,0,.35); max-width:calc(100vw - 32px); text-align:center; }
  .toast.show{ opacity:1; }
  .toast.toast-error{ background:var(--danger); color:#fff; }
  .save-banner{ position:fixed; left:0; right:0; top:0; z-index:150; background:var(--danger); color:#fff; padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px; font-size:15px; font-weight:700; line-height:1.4; }
  .locked-note{ background:var(--yellow); color:var(--yellow-ink); border-radius:12px; padding:10px 12px; font-weight:700; font-size:14px; margin-bottom:12px; display:flex; align-items:center; gap:10px; }
  .locked-note span{ flex:1; }
  .locked-note .btn{ background:var(--yellow-ink); color:var(--yellow); width:auto; }
  .menu-list .btn{ justify-content:flex-start; margin-bottom:8px; }
</style>
</head>
<body>
<div id="saveFailedBanner" class="save-banner hidden">Couldn't save to the phone. Your last change is NOT stored. Make a backup now (menu → Backup &amp; restore) and free up space on the phone.</div>
<div class="app">
  <div class="topbar">
    <button class="iconbtn" id="btnDrawer" aria-label="Menu">☰</button>
    <div class="id"><div class="vessel" id="tbTitle">ANTARES</div><div class="sub" id="tbSub">Tuna pole-and-line logbook</div></div>
    <button class="iconbtn" id="btnTheme" aria-label="Sun mode">☀</button>
  </div>
  <div class="screen" id="screen"></div>
</div>
<div class="fab-wrap hidden" id="fab"></div>
<div class="drawer-wrap" id="drawerWrap" aria-hidden="true"><nav class="drawer" id="drawer"></nav></div>
<div class="toast" id="toast"></div>
